name: Deploy portal

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, portal]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build

      - name: Deploy to Nginx
        run: |
          rsync -av --delete dist/ /var/www/portal-ia/
